name: JlightCalendar CI Suite

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-verify:
    name: Build, Unit & Mocked System Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: "file:./.tmp-ci.db"
      AUTH_SECRET: "ci-mock-auth-secret-key-for-github-actions"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests & React Rules-of-Hooks AST Guard
        run: npm run test:unit

      - name: Run Mocked DB & End-to-End API System Tests
        run: npm run test:system

      - name: Run Production Build & TypeScript Check
        run: npm run build

  e2e-playwright:
    name: Playwright Real-Browser E2E & Show-and-Tell Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "file:./.tmp-e2e.db"
      JLIGHT_TEST_MODE: "true"
      AUTH_SECRET: "ci-mock-auth-secret-key-for-github-actions"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi

      - name: Build production bundle
        run: npm run build

      - name: Run Playwright E2E Suite
        run: npm run test:e2e

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Show & Tell Verification Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: show-and-tell-screenshots
          path: test-results/show-and-tell/
          if-no-files-found: ignore
          retention-days: 14
